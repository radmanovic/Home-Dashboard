<html lang="sr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e3f0fb">
<meta name="mobile-web-app-capable" content="yes">

<title>Niš dashboard</title>
<style>
:root{--bg:#f7f5fb;--line:rgba(44,58,70,.14);--tx:#2c3a46;--mut:#6b7c8a;--sky:#2c8a7e;--gold:#b46f0c;--red:#cf5446}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%;background:#fff;color:var(--tx);font-family:Roboto,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.app{height:100%;display:grid;grid-template-columns:.9fr 1.5fr 1.1fr;gap:3px;background:#fff}
section{padding:3vh 1.8vw;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
#w{background:#e3f0fb;position:relative}#n{background:#e6f3e4;gap:1.8vh;animation-delay:.14s}#m{background:#fdefdb;animation-delay:.28s}
#w>*:not(#fx){position:relative;z-index:1}
#w{color:var(--tx);transition:background 1.5s,color 1.5s}
#w[data-ph=dawn]{background:linear-gradient(180deg,#f9d6cf,#fde9cc 55%,#e3f0fb)}
#w[data-ph=dusk]{background:linear-gradient(180deg,#d8d0f1,#f8d1c3 65%,#fde6c8)}
#w[data-ph=night]{background:linear-gradient(180deg,#252f58,#3e4d80);--tx:#eef2ff;--mut:#b3bde0;--sky:#8fe0d1;--line:rgba(255,255,255,.22)}
#w[data-ph=night] .cl{background:rgba(160,175,220,.4)}
#w[data-ph=night] .dr{background:linear-gradient(transparent,rgba(190,210,255,.65))}
.moon{top:22vh;right:2vw;width:10vh;height:10vh;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe8,#e6dfbd 75%);box-shadow:0 0 6vh 2vh rgba(255,248,210,.3);animation:glow 8s ease-in-out infinite}
.st{border-radius:50%;background:#fff;animation:twinkle ease-in-out infinite}
.sun.low{top:auto;bottom:-18vh;right:auto;left:-8vw;background:radial-gradient(circle,#ffc79a 0%,rgba(255,170,120,.55) 40%,rgba(255,170,120,0) 70%)}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
small,.mut{color:var(--mut);font-weight:400}
.top{display:flex;justify-content:space-between;align-items:baseline}
.city{font-size:3.8vh;font-weight:500}
.clk{text-align:right}.clk span{font-size:3.8vh;font-variant-numeric:tabular-nums}.clk small{display:block;font-size:2.1vh}
.now{display:flex;align-items:center;gap:1.2vw;margin-top:1vh}
#ico{width:13vh;height:13vh;flex:none}
#ico svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 .5vh .8vh rgba(50,85,130,.28))}
.rot{transform-box:fill-box;transform-origin:center;animation:spin 22s linear infinite}
.pl{transform-box:fill-box;transform-origin:center;animation:glow 4s ease-in-out infinite}
.fl{animation:flt 7s ease-in-out infinite alternate}.fl2{animation-duration:9s;animation-direction:alternate-reverse}
.rd{animation:rd 1.1s linear infinite}.sn{animation:sn 3s linear infinite}.bo{animation:bolt 3.2s linear infinite}
.tw{animation:twinkle 3s ease-in-out infinite}
.cl1{fill:var(--c,#fff);stroke:rgba(90,120,165,.35);stroke-width:1.4}.s-rain{--c:#d3deec}.s-snow{--c:#dce7f3}.s-storm{--c:#aebbd0}
#w[data-ph=night] .cl1{fill:#cdd5f0}#w[data-ph=night] .s-storm .cl1{fill:#8e9bbd}
#w[data-ph=night] #ico svg{filter:drop-shadow(0 0 1vh rgba(255,244,190,.45))}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flt{from{transform:translateX(-3px)}to{transform:translateX(4px)}}
@keyframes rd{0%{transform:translateY(-6px);opacity:0}25%{opacity:1}100%{transform:translateY(14px);opacity:0}}
@keyframes sn{0%{transform:translate(0,-6px);opacity:0}20%{opacity:1}100%{transform:translate(4px,14px);opacity:0}}
@keyframes bolt{0%,60%,100%{opacity:0}62%,66%{opacity:1}64%{opacity:.2}68%{opacity:0}}
#temp{font-size:24vh;font-weight:200;line-height:1;letter-spacing:-.04em}
#desc{font-size:3.4vh;color:var(--sky)}
#meta{font-size:2.3vh;margin-top:.6vh;line-height:1.35}
#days{display:flex;gap:.5vw;margin-top:auto}
.day{flex:1;text-align:center;border-top:1px solid var(--line);padding-top:1.2vh}
.day small{font-size:2.1vh}.day i{display:block;font-style:normal;font-size:4.2vh;margin:.3vh 0}.day b{display:block;font-size:2.5vh;font-weight:500}.day em{font-style:normal;color:var(--mut);font-size:2.2vh}
.card{flex:1;min-height:0;display:flex;gap:1.6vw;background:rgba(255,255,255,.66);border-radius:2.2vh;padding:1.5vh;text-decoration:none;color:var(--tx);overflow:hidden}
.ph{flex:0 0 41%;border-radius:1.5vh;overflow:hidden;background:#d5e5ea;position:relative;display:flex;align-items:center;justify-content:center;font-size:9vh}
.card[data-c=biz] .ph{background:#f6e8c8}.card[data-c=svet] .ph{background:#d3e4f6}.card[data-c=inov] .ph{background:#e4defa}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s}
.ph img.ok{opacity:1;animation:kb 16s linear forwards}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;padding:.4vh 0}
.chip{align-self:flex-start;font-size:2vh;font-weight:500;padding:.4vh 1.3vh;border-radius:3vh;background:#cfe8e4;color:#1d6a60}
.card[data-c=biz] .chip{background:#fbe5b8;color:#8a5a0a}.card[data-c=svet] .chip{background:#cfe3f7;color:#1f5a8f}.card[data-c=inov] .chip{background:#e0d9f7;color:#5a43a8}
.hl{font-size:2.8vh;line-height:1.25;font-weight:500;margin:.9vh 0 .6vh;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.body{flex:1;min-height:0;overflow:hidden;-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
.bi{font-size:2.35vh;line-height:1.4;color:var(--tx);opacity:.82;padding-bottom:3.5vh;will-change:transform}
.mt{margin-top:.6vh;font-size:2.1vh;color:var(--mut)}
.dots{display:flex;gap:.5vh;margin-top:.8vh;height:.8vh}.dots i{flex:1;max-width:3vh;border-radius:1vh;background:rgba(44,58,70,.15)}.dots i.on{background:var(--sky)}
.mh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1.4vh}.mh small{font-size:2.4vh}
#ywrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:5vh}
#ewrap{position:absolute;inset:0;background:#fff}
#rcard{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 2.2vw;background:linear-gradient(135deg,#ffe6bd,#f6c7a0);animation:rise .6s both}
#rcard .fm{font-size:15vh;font-weight:200;line-height:1;color:#9a5a0c;letter-spacing:-.03em}#rcard .fm small{font-size:3vh;margin-left:.5vw;color:#9a5a0c;opacity:.7}
#rcard .eq{height:9vh;gap:.9vh}#rcard .eq span{width:1.5vh;background:#9a5a0c}
.tabs{display:flex;gap:.6vw}
.tabs button{border:0;border-radius:3vh;padding:.6vh 1.5vh;font:inherit;font-size:2.4vh;background:rgba(255,255,255,.55);color:var(--mut)}
.tabs button.on{background:var(--gold);color:#fff}
#trow{display:flex;align-items:center;gap:.8vw;margin:1vh 0}
#trow button{border:0;border-radius:50%;width:3.8vh;height:3.8vh;background:rgba(255,255,255,.85);color:var(--gold);font-size:2.8vh;line-height:1;flex:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:.5vh solid var(--gold);outline-offset:.4vh}
#ewrap iframe{width:100%;height:100%;border:0;display:block}
.mh h2{font-size:3.4vh;font-weight:500}
.eq{display:flex;gap:.5vh;align-items:flex-end;height:3vh}.eq span{width:.7vh;height:35%;border-radius:1vh;background:var(--gold)}
.eq.on span{animation:eq 1s ease-in-out infinite}.eq.on span:nth-child(2){animation-delay:.25s}.eq.on span:nth-child(3){animation-delay:.5s}.eq.on span:nth-child(4){animation-delay:.12s}
#pw{height:24vh;border-radius:1.8vh;overflow:hidden;background:#f3d9b8;position:relative}
#pw iframe{position:absolute;left:0;top:50%;transform:translateY(-50%);width:100%;height:auto;aspect-ratio:16/9;border:0;pointer-events:none}
#ttl{flex:1;min-width:0;font-size:2.3vh;color:var(--mut);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;align-items:center;gap:1.2vw}
.ctl button{border:0;border-radius:50%;width:6.2vh;height:6.2vh;background:rgba(255,255,255,.75);color:var(--tx);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.ctl button:active{transform:scale(.9)}.ctl #pp{width:7.4vh;height:7.4vh;background:var(--gold);color:#fff}
.ctl svg{width:55%;height:55%;fill:currentColor}
.ctl input{flex:1;min-width:0;accent-color:var(--gold)}
#rnote{font-size:2.1vh;color:var(--mut);margin:1.2vh 0 .2vh}#rnote.old{color:var(--red)}
.rate{display:flex;align-items:baseline;justify-content:space-between;padding:.9vh 0;border-top:1px solid var(--line)}
.rate b{font-size:3.2vh;font-weight:500}
.rate strong{font-size:4.8vh;font-weight:400;color:var(--gold);font-variant-numeric:tabular-nums;border-radius:1vh}
.rate strong small{font-size:3vh;color:var(--gold);opacity:.7}.rate strong.flash{animation:flash 2s}
.up{margin-top:auto;display:flex;align-items:center;gap:1.2vw;padding-top:1.2vh;border-top:1px solid var(--line);font-size:2.6vh}
.up i{width:2.2vh;height:2.2vh;border-radius:50%;background:var(--mut);flex:none}
.up.ok i{background:var(--sky);animation:pulse 2s ease-out infinite}.up.down i{background:var(--red)}
.up small{margin-left:auto;font-size:2.1vh;text-align:right}.up.down small{color:var(--red)}
.err{color:var(--red);font-size:2.4vh}
.c{font-weight:inherit;animation:blink 2s ease-in-out infinite}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#fx i{position:absolute;display:block}
.sun{top:-14vh;right:-8vw;width:48vh;height:48vh;border-radius:50%;background:radial-gradient(circle,#ffe9a8 0%,rgba(255,226,140,.55) 40%,rgba(255,226,140,0) 70%);animation:glow 6s ease-in-out infinite}
.cl{left:0;border-radius:50vh;background:#fff;filter:blur(1.2vh);animation:drift linear infinite}
.dr{top:0;width:2px;height:3.4vh;background:linear-gradient(transparent,rgba(70,120,175,.55));animation:fall linear infinite}
.sf{top:0;border-radius:50%;background:#fff;box-shadow:0 0 .6vh rgba(120,160,200,.7);animation:snow linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(3vh)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-1.4vh) rotate(4deg)}}
@keyframes pulse{from{box-shadow:0 0 0 0 rgba(44,138,126,.55)}to{box-shadow:0 0 0 1.8vh rgba(44,138,126,0)}}
@keyframes blink{50%{opacity:.15}}
@keyframes flash{0%,100%{background:transparent}20%{background:rgba(240,185,77,.55)}}
@keyframes fall{from{transform:translateY(-6vh)}to{transform:translateY(108vh)}}
@keyframes snow{from{transform:translate(0,-6vh)}50%{transform:translate(2vw,50vh)}to{transform:translate(-1vw,108vh)}}
@keyframes drift{from{transform:translateX(-40vw)}to{transform:translateX(55vw)}}
@keyframes glow{50%{opacity:.75;transform:scale(1.12)}}
@keyframes kb{to{transform:scale(1.09)}}
@keyframes eq{50%{height:100%}}

/* lofi scena */
#lcard{position:absolute;inset:0;background:#2b2159;overflow:hidden;animation:rise .6s both}
#lcard svg{position:absolute;inset:0;width:100%;height:100%}
#leq{position:absolute;left:1.4vw;bottom:1.2vh;height:3.2vh}#leq span{background:#ffd9e6}
.lf-rain{stroke:#a9c4ff;stroke-width:1.1;stroke-linecap:round;opacity:.7;animation:lfrain linear infinite}
.lf-st{fill:#fff;animation:twinkle ease-in-out infinite}
.lf-win{fill:#ffd98a;animation:lfblink ease-in-out infinite}
.lf-glow,.lf-moon{transform-box:fill-box;transform-origin:center;animation:glow 6s ease-in-out infinite}
.lf-steam{fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;opacity:0;animation:lfsteam 3.2s ease-in-out infinite}
.lf-spin{transform-box:fill-box;transform-origin:center;animation:spin 3.6s linear infinite}
.lf-tail{transform-box:fill-box;transform-origin:100% 100%;animation:lftail 2.6s ease-in-out infinite alternate}
.lf-note{fill:#ffd9e6;font-size:13px;opacity:0;animation:lfnote 6s ease-in infinite}
.lf-code{fill:#9ad8ff;transform-box:fill-box;transform-origin:0 50%;animation:lfcode 2.8s ease-in-out infinite}
@keyframes lfrain{from{transform:translateY(-14px)}to{transform:translateY(96px)}}
@keyframes lfblink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes lfsteam{0%{opacity:0;transform:translateY(4px)}30%{opacity:.7}100%{opacity:0;transform:translateY(-10px)}}
@keyframes lftail{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
@keyframes lfnote{0%{opacity:0;transform:translate(0,0)}15%{opacity:.9}100%{opacity:0;transform:translate(14px,-46px)}}
@keyframes lfcode{0%,100%{transform:scaleX(.25)}50%{transform:scaleX(1)}}
/* sport */
#sp{flex:1.15;min-height:0;display:flex;flex-direction:column;gap:1vh}
.card.s{padding:1.1vh}.card.s .ph{flex-basis:34%;font-size:6vh}.card.s .hl{font-size:2.7vh;-webkit-line-clamp:4}.card.s .body,.card.s .dots{display:none}.card.s .mt{margin-top:auto}
.card[data-c=sport] .ph{background:#f9dccf}.card[data-c=sport] .chip{background:#fbd9c8;color:#a1411a}
/* zastave i rezultati nedelje */
.rate b{display:flex;align-items:center;gap:1.2vh}
.fg{height:3.4vh;width:5.1vh;flex:none;border-radius:.6vh;box-shadow:0 0 0 1px rgba(0,0,0,.1)}
#aq{font-size:2.3vh;margin-top:.5vh;display:flex;align-items:center;gap:.8vh}#aq i{width:1.8vh;height:1.8vh;border-radius:50%;flex:none}#aq b{color:var(--tx);font-weight:500}
#cal{margin-top:.7vh;font-size:2.3vh;line-height:1.3}#cal small{display:block;font-size:2.1vh}
#nm{position:fixed;inset:0;background:#000;color:#8aa0ad;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50}
#nmt{font-size:34vh;font-weight:200;line-height:1;font-variant-numeric:tabular-nums}#nmd{font-size:4vh;margin-top:2vh}
#ai{flex:1;min-height:0;margin:.9vh 0 .8vh;display:flex}
.rc{flex:1;min-height:0;background:rgba(255,255,255,.66);border-radius:2.2vh;padding:1.1vh 1vw;display:flex;flex-direction:column;overflow:hidden;animation:rise .6s both}
.rc .rh{display:flex;justify-content:space-between;align-items:center}.rc .rh em{font-style:normal;font-size:2vh;color:var(--mut)}
.rc.nfl .chip{background:#dbe6f6;color:#1f4a8a}.rc.eur .chip{background:#fbe3cc;color:#a1511a}
.rc .rf{font-size:2vh;color:var(--mut);margin:.6vh 0 .3vh;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc .dots{margin-top:auto;padding-top:.5vh}
.g{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) 7.5vh;column-gap:.7vw;align-items:center;padding:.4vh .8vw;margin:.15vh 0;border-radius:1vh;font-size:2.2vh;line-height:1.2}
.g .t{font-weight:500;white-space:nowrap}.g .t.a{text-align:right}
.g .sc{font-weight:500;font-variant-numeric:tabular-nums;text-align:center;min-width:7vh}
.g .sc.up{color:var(--mut);font-weight:400}.g .w{color:#1d7a4d}
.g em{font-style:normal;color:var(--mut);font-size:1.9vh;text-align:right;white-space:nowrap}
.g.fav{box-shadow:inset .5vh 0 0 var(--fc)}.g.fav .t{font-weight:700}
.g.fav.pit{--fc:#ffb612;background:rgba(255,182,18,.3)}.g.fav.par{--fc:#222;background:rgba(34,34,34,.13)}
.g.live em{color:var(--red)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>

function wmo(c,n){if(c===0)return['Vedro',n?'🌙':'☀️'];if(c<=2)return['Pretežno vedro',n?(c===1?'🌙':'🌥️'):'🌤️'];if(c===3)return['Oblačno','☁️'];if(c<=48)return['Magla','🌫️'];if(c<=57)return['Rosulja','🌦️'];if(c<=67)return['Kiša','🌧️'];if(c<=77)return['Sneg','🌨️'];if(c<=82)return['Pljuskovi','🌦️'];if(c<=86)return['Snežni pljuskovi','🌨️'];return['Grmljavina','⛈️']}
let shown=0;
function countTemp(v){const el=$('#temp'),from=shown,t0=performance.now();shown=v;(function f(n){const p=Math.min((n-t0)/1100,1),e=1-Math.pow(1-p,3);el.textContent=Math.round(from+(v-from)*e)+'°';if(p<1)requestAnimationFrame(f)})(t0)}
function phase(j){
 try{const hm=t=>{const m=t.slice(11,16).split(':');return +m[0]*60+ +m[1]},n=new Date().toLocaleTimeString('sv-SE',{timeZone:'Europe/Belgrade',hour12:false,hour:'2-digit',minute:'2-digit'}).split(':'),now=+n[0]*60+ +n[1];
  if(!j.daily.sunrise)return now<390||now>1230?'night':'day';
  const sr=hm(j.daily.sunrise[0]),ss=hm(j.daily.sunset[0]);
  if(now<sr-30||now>ss+30)return'night';if(now<sr+60)return'dawn';if(now>ss-60)return'dusk';return'day'}catch{return'day'}}
function fx(code,ph){
 const k=code<=1?'sun':code<=3||(code>=45&&code<=48)?'cloud':(code>=71&&code<=77)||code===85||code===86?'snow':'rain',f=$('#fx'),key=k+ph;
 if(f.dataset.k===key)return;f.dataset.k=key;f.replaceChildren();
 const R=(a,b)=>a+Math.random()*(b-a),add=(c,st)=>{const e=document.createElement('i');e.className=c;Object.assign(e.style,st);f.append(e)};
 if(k==='sun'){if(ph==='night'){for(let n=0;n<32;n++){const z=R(.3,.8)+'vh';add('st',{left:R(0,100)+'%',top:R(0,75)+'%',width:z,height:z,animationDelay:-R(0,5)+'s',animationDuration:R(2,5)+'s'})}}else add(ph==='day'?'sun':'sun low',{})}
 if(k==='cloud')for(let n=0;n<4;n++)add('cl',{top:R(2,60)+'%',width:R(22,38)+'vw',height:R(8,14)+'vh',opacity:R(.4,.75),animationDuration:R(40,70)+'s',animationDelay:-R(0,60)+'s'});
 if(k==='rain')for(let n=0;n<30;n++)add('dr',{left:R(0,100)+'%',animationDuration:R(.7,1.3)+'s',animationDelay:-R(0,1.3)+'s'});
 if(k==='snow')for(let n=0;n<24;n++){const z=R(.8,1.6)+'vh';add('sf',{left:R(0,100)+'%',width:z,height:z,animationDuration:R(5,10)+'s',animationDelay:-R(0,10)+'s'})}
}
let W=null;
const CLOUD='<path class="cl1" d="M28 72a13 13 0 0 1 1-26 19 19 0 0 1 36-3 15 15 0 0 1 3 29z"/>';
const RAYS=[...Array(8)].map((_,i)=>{const a=i*Math.PI/4,c=Math.cos(a),n=Math.sin(a);return `<line x1="${24*c}" y1="${24*n}" x2="${34*c}" y2="${34*n}"/>`}).join('');
const SUNG=(x,y,k)=>`<g transform="translate(${x} ${y}) scale(${k})"><g class="rot"><g stroke="#f4b43c" stroke-width="5" stroke-linecap="round">${RAYS}</g></g><circle class="pl" r="17" fill="#f7c04a"/></g>`;
const MOONG=(x,y,k)=>`<g transform="translate(${x} ${y}) scale(${k})"><g class="pl"><path d="M8 -26a28 28 0 1 0 22 40 22 22 0 0 1 -22 -40z" transform="translate(-14 -2)" fill="#f6e7a6"/></g><circle class="tw" cx="24" cy="-22" r="2" fill="#fff"/><circle class="tw" cx="34" cy="-8" r="1.5" fill="#fff" style="animation-delay:-1s"/></g>`;
function iconSVG(code,night){
 const B=night?MOONG:SUNG,cl=(t='',c='fl')=>`<g transform="${t}"><g class="${c}">${CLOUD}</g></g>`;
 const drops=[38,50,62].map((x,i)=>`<line class="rd" x1="${x}" y1="80" x2="${x-2}" y2="88" stroke="#5aa0e0" stroke-width="3.5" stroke-linecap="round" style="animation-delay:-${i*.37}s"/>`).join('');
 const flakes=[36,50,64].map((x,i)=>`<circle class="sn" cx="${x}" cy="82" r="2.8" fill="#fff" stroke="#a9c8e8" style="animation-delay:-${i}s"/>`).join('');
 let k='rain',g;
 if(code<=1)return `<svg viewBox="0 0 100 100" class="${night?'moon-glow':''}">${B(50,50,1)}</svg>`;
 if(code===2)g=B(38,36,.75)+cl('translate(6 8)');
 else if(code===3)g=cl('translate(-10 -12) scale(.75)','fl fl2')+cl('translate(4 4)');
 else if(code<=48){k='fog';g=cl('translate(0 -10)')+[78,86,94].map((y,i)=>`<line class="fl${i===1?' fl2':''}" x1="${26+i*4}" y1="${y}" x2="${74-i*4}" y2="${y}" stroke="#b9c6d6" stroke-width="4" stroke-linecap="round"/>`).join('')}
 else if(code>=95){k='storm';g=cl('translate(0 -10)')+'<polygon class="bo" points="52,62 42,82 51,82 46,98 62,74 53,74 58,62" fill="#f6c744"/>'}
 else if((code>=71&&code<=77)||code===85||code===86){k='snow';g=cl('translate(0 -10)')+flakes}
 else g=cl('translate(0 -10)')+drops;
 return `<svg viewBox="0 0 100 100" class="s-${k}">${g}</svg>`}
function applyPhase(){if(!W)return;const ph=phase(W),c=W.current;$('#w').dataset.ph=ph;$('#ico').innerHTML=iconSVG(c.weather_code,ph==='night');fx(c.weather_code,ph)}
function drawWeather(j){
 const c=j.current,[t,i]=wmo(c.weather_code);
 W=j;countTemp(Math.round(c.temperature_2m));applyPhase();$('#desc').textContent=t;
 $('#meta').textContent=`Osećaj ${Math.round(c.apparent_temperature)}° · vlažnost ${c.relative_humidity_2m}% · vetar ${Math.round(c.wind_speed_10m)} km/h`;
 const first=!$('#days').children.length;
 $('#days').replaceChildren(...j.daily.time.map((d,k)=>{const e=document.createElement('div');e.className='day';if(first)e.style.animation=`rise .7s ${.5+k*.1}s both`;
  const nm=k===0?'danas':new Date(d+'T12:00').toLocaleDateString(LOC,{weekday:'short'});
  e.innerHTML=`<small>${nm}</small><i>${wmo(j.daily.weather_code[k])[1]}</i><b>${Math.round(j.daily.temperature_2m_max[k])}°</b><em>${Math.round(j.daily.temperature_2m_min[k])}°</em>`;return e}));
}
async function weather(){
 try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=43.3209&longitude=21.8958&current=is_day,temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=Europe%2FBelgrade&forecast_days=5',{cache:'no-store'});
  const j=await r.json();if(!j.current)throw 0;LS.set('w',j);drawWeather(j)}
 catch{const j=LS.get('w');if(j)drawWeather(j);else $('#desc').innerHTML='<span class="err">Nema podataka o vremenu</span>'}
}

/* SREDNJI KURS (NBS preko kurs.resenje.org; rezerva: tržišni kurs) */
const STARS=[...Array(12)].map((_,i)=>{const a=i*Math.PI/6;return `<circle cx="${(18+7.5*Math.sin(a)).toFixed(1)}" cy="${(12-7.5*Math.cos(a)).toFixed(1)}" r="1.1" fill="#fc0"/>`}).join('');
const FLAG={EUR:`<svg class="fg" viewBox="0 0 36 24" aria-hidden="true"><rect width="36" height="24" fill="#039"/>${STARS}</svg>`,CHF:`<svg class="fg" viewBox="0 0 36 24" aria-hidden="true"><rect width="36" height="24" fill="#da291c"/><path fill="#fff" d="M15 5h6v4h5v6h-5v4h-6v-4h-5V9h5z"/></svg>`};
const prevR={};
const fmt=n=>n.toFixed(4).replace('.',',');
function drawRates(R){
 const e=R.EUR||R.CHF,old=e&&e.date&&(Date.now()-new Date(e.date))/864e5>5;
 $('#rnote').className=old?'old':'';
 $('#rnote').textContent=(e&&e.approx?'srednji kurs · tržišni, okvirno':'srednji kurs NBS')+(e&&e.date?' · '+e.date.slice(8)+'.'+e.date.slice(5,7)+'.':'')+(old?' (stari podatak)':'');
 $('#rates').replaceChildren(...['EUR','CHF'].map(k=>{const v=R[k],d=document.createElement('div');d.className='rate';
  if(!v){d.innerHTML=`<b>${FLAG[k]||''}${k}</b><span class="err">nema podatka</span>`;return d}
  const s=fmt(v.mid);d.innerHTML=`<b>${FLAG[k]||''}${k}</b><strong class="${prevR[k]&&prevR[k]!==s?'flash':''}">${s.slice(0,-2)}<small>${s.slice(-2)}</small></strong>`;prevR[k]=s;return d}));
}
async function rates(){
 let R=null;
 try{const j=await(await fetch('https://kurs.resenje.org/api/v1/rates/today',{cache:'no-store'})).json(),m={};
  for(const x of j.rates||[])if(x.code==='EUR'||x.code==='CHF')m[x.code]={mid:x.exchange_middle/(x.parity||1),date:x.date};
  if(m.EUR&&m.CHF)R=m}catch{}
 if(!R)try{const j=await(await fetch('https://open.er-api.com/v6/latest/EUR',{cache:'no-store'})).json(),r=j.rates;
  R={EUR:{mid:r.RSD,approx:1},CHF:{mid:r.RSD/r.CHF,approx:1}}}catch{}
 if(R)LS.set('r2',R);else R=LS.get('r2');
 if(R)drawRates(R);else $('#rates').innerHTML='<span class="err">Kurs trenutno nije dostupan</span>';
}

/* VESTI SA SLIKAMA (RSS preko rss2json): Srbija = politika + biznis, Svet = svet + inovacije; bez crne hronike */
const API='https://api.rss2json.com/v1/api.json?rss_url=';
const CATS={pol:'Skupština i vlada',biz:'Biznis',svet:'Svet',inov:'Inovacije',sport:'Sport'};
const EMO={pol:'📰',biz:'📈',svet:'🌍',inov:'💡',sport:'🏀'};
const NS={p:{items:[],i:0},a:{items:[],i:0},s:{items:[],i:0}};
for(const k of['p','a','s']){const c=document.createElement('a');c.className='card '+k;c.id='c'+k;c.target='_blank';c.rel='noopener';
 c.innerHTML=`<div class="ph"><span></span><img alt="" referrerpolicy="no-referrer"></div><div class="tx"><span class="chip"></span><b class="hl">Učitavanje…</b><div class="body"><div class="bi"></div></div><div class="mt"></div><div class="dots"></div></div>`;if(k==='s')$('#sp').append(c);else $('#n').insertBefore(c,$('#sp'))}
const ago=d=>{const m=Math.round((Date.now()-d)/60000);return m<60?`pre ${Math.max(m,1)} min`:m<1440?`pre ${Math.round(m/60)} h`:`pre ${Math.round(m/1440)} d`};
const dec=t=>{const e=document.createElement('textarea');e.innerHTML=t||'';return e.value};
const clean=h=>{let t=plain(h).replace(/\s*(The post .+? appeared first on .+?|Read more.*|Pročitajte više.*|Pročitaj više.*)$/i,'');if(t.length>700){t=t.slice(0,700);const e=t.lastIndexOf('. ');t=e>300?t.slice(0,e+1):t.replace(/\s\S*$/,'…')}return t};
const plain=h=>dec((h||'').replace(/<[^>]*>/g,' ')).replace(/\s+/g,' ').trim();
const host=l=>{try{return new URL(l).hostname.replace(/^www\./,'')}catch{return''}};
const imgOf=i=>(i.thumbnail||(i.enclosure&&/image/.test(i.enclosure.type||'')&&i.enclosure.link)||((i.content||i.description||'').match(/<img[^>]+src=["']([^"']+)/i)||[])[1]||'').replace(/^http:/,'https:');
let q=0;
async function feed(u,cat){const j=await(await fetch(API+encodeURIComponent(u),{cache:'no-store'})).json();if(j.status!=='ok')throw 0;
 return j.items.map(i=>({title:dec(i.title),link:i.link,date:new Date(i.pubDate.replace(' ','T')+'Z'),img:imgOf(i),src:host(i.link),txt:clean(i.content||i.description),cat})).filter(i=>!isNaN(i.date))}
async function gather(urls,cat,flt){const o=[];
 await Promise.all(urls.map(async u=>{await new Promise(r=>setTimeout(r,(q++)*300));try{o.push(...await feed(u,cat))}catch{}}));
 return o.filter(i=>!BLACK.test(i.title+' '+i.txt.slice(0,160))&&(!flt||flt(i)))}
const uniq=a=>{const t=new Set();return a.filter(i=>!t.has(i.title)&&t.add(i.title))};
const newest=(a,n)=>uniq(a).sort((x,y)=>y.date-x.date).slice(0,n);
const rr=(...ls)=>{const o=[],m=Math.max(0,...ls.map(l=>l.length));for(let n=0;n<m;n++)for(const l of ls)if(l[n])o.push(l[n]);return o};
function show(k){
 const s=NS[k],it=s.items[s.i];if(!it)return;const c=$('#c'+k),im=c.querySelector('img'),tx=c.querySelector('.tx');
 c.dataset.c=it.cat;c.href=it.link;c.querySelector('.chip').textContent=CATS[it.cat]||'';c.querySelector('.ph span').textContent=EMO[it.cat]||'📰';
 c.querySelector('.hl').textContent=it.title;{let t=it.txt||'';if(t.startsWith(it.title))t=t.slice(it.title.length).trim();c.querySelector('.bi').textContent=t.length<40?'':t}
 c.querySelector('.mt').textContent=[it.src,ago(it.date)].filter(Boolean).join(' · ');
 c.querySelector('.dots').innerHTML=s.items.map((_,n)=>`<i class="${n===s.i?'on':''}"></i>`).join('');
 im.classList.remove('ok');im.style.display='';
 if(it.img){im.onload=()=>im.classList.add('ok');im.onerror=()=>{im.style.display='none'};im.src=it.img;if(im.complete&&im.naturalWidth)im.classList.add('ok')}else im.removeAttribute('src');
 tx.style.animation='none';void tx.offsetWidth;tx.style.animation='rise .7s both';play(k)}
const TM={p:0,a:0};
function advance(k){const t=NS[k];if(t.items.length>1)t.i=(t.i+1)%t.items.length;show(k)}
/* prvo naslov, pa tekst vesti sa automatskim skrolom, pa sledeća vest */
function play(k){
 clearTimeout(TM[k]);if(k==='s'){TM[k]=setTimeout(()=>advance(k),11000);return}const c=$('#c'+k),b=c.querySelector('.body'),bi=c.querySelector('.bi');
 bi.style.transition='none';bi.style.transform='translateY(0)';void bi.offsetWidth;
 const over=bi.scrollHeight-b.clientHeight,len=bi.textContent.length;
 if(!len){TM[k]=setTimeout(()=>advance(k),9000);return}
 if(over>4){const dur=Math.max(6000,over*140);TM[k]=setTimeout(()=>{bi.style.transition=`transform ${dur}ms linear`;bi.style.transform=`translateY(-${over}px)`;TM[k]=setTimeout(()=>advance(k),dur+3000)},4500)}
 else TM[k]=setTimeout(()=>advance(k),Math.min(14000,6000+len*25))}
function setNews(k,items){const same=NS[k].items[0]&&items[0]&&NS[k].items[0].link===items[0].link;NS[k].items=items;if(!same){NS[k].i=0;show(k)}}
async function news(){
 q=0;
 const [pol,biz,svet,inov,spt]=await Promise.all([gather(FEEDS.pol,'pol',i=>/kurir/.test(i.src)||POL.test(i.title+' '+i.txt.slice(0,300))),gather(FEEDS.biz,'biz'),gather(FEEDS.svet,'svet'),gather(FEEDS.inov,'inov'),gather(FEEDS.sport,'sport')]);
 const S=await sportNews(spt);
 let P=rr(newest(pol,4),newest(biz,4)).slice(0,8);const A=rr(newest(svet,4),newest(inov,4)).slice(0,8);
 if(!P.length)try{const g=await(await fetch(API+encodeURIComponent('https://news.google.com/rss/search?q='+encodeURIComponent('Skupština Srbije vlada when:3d')+'&hl=sr&gl=RS&ceid=RS:sr'))).json();
  P=g.items.map(i=>{const x=i.title.lastIndexOf(' - ');return{title:dec(x>0?i.title.slice(0,x):i.title),src:x>0?i.title.slice(x+3):'',link:i.link,img:'',cat:'pol',date:new Date(i.pubDate.replace(' ','T')+'Z')}}).sort((x,y)=>y.date-x.date).slice(0,6)}catch{}

 return out.slice(0,8)}
const loadHls=()=>window.Hls?Promise.resolve(true):new Promise(r=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js';sc.onload=()=>r(!!window.Hls);sc.onerror=()=>r(false);document.head.append(sc)});
const isHls=u=>/\.m3u8|\/ldblncr\//.test(u);
async function tryPlay(u){
 if(hlsObj){hlsObj.destroy();hlsObj=null}
 if(isHls(u)&&!au.canPlayType('application/vnd.apple.mpegurl')&&await loadHls()&&Hls.isSupported()){hlsObj=new Hls();hlsObj.loadSource(u);hlsObj.attachMedia(au)}else au.src=u;
 return Promise.race([au.play().then(()=>true),new Promise(r=>setTimeout(()=>r(false),8000))]).catch(()=>false)}
async function radio(){
 const t=cur(),key=t&&t.r;if(!key||busy)return;busy=true;$('#ttl').textContent=t.name+' · povezivanje…';
 try{
  const saved=LS.get('rurl:'+key);if(!cands[key])cands[key]=await resolveRadio(key);
  const c=[...new Set([...(saved?[saved]:[]),...cands[key]])];let ok=false;
  for(const u of c){if(await tryPlay(u)){ok=true;LS.set('rurl:'+key,u);break}stopAu()}
  if(ok)$('#ttl').textContent=t.name+' · uživo';
  else{$('#ttl').innerHTML=`Stream ne svira (probano ${c.length}) · <a href="#" id="setu" style="color:var(--gold)">upiši link</a>`;
   $('#setu').onclick=e=>{e.preventDefault();const u=prompt('Nalepi direktan link stream-a (mp3/aac):');if(u){LS.set('custom:'+key,u.trim());LS.set('rurl:'+key,null);cands[key]=null;radio()}}}
 }catch{}
 busy=false}

function apply(play){
 const L=list();if(idx>=L.length)idx=0;const t=L[idx];
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.g===grp));
 $('#addb').hidden=grp!=='knjige';$('#delb').hidden=!(grp==='knjige'&&t&&t.custom);
 $('#prev').hidden=$('#next').hidden=L.length<2;
 if(yt&&yt.pauseVideo)try{yt.pauseVideo()}catch{}
 stopAu();$('#efr').src='about:blank';setPlaying(false);
 const yty=!!(t&&(t.y||t.pl)),emb=!!(t&&t.embed),rad=!!(t&&t.r);
 const lo=LOFI_SCENE&&grp==='lofi'&&!emb&&!!t;$('#ywrap').hidden=!yty||ytBad;$('#ewrap').hidden=!emb;$('#rcard').hidden=!rad||lo;$('#lcard').hidden=!lo;
 $('#pp').hidden=$('#vol').hidden=emb||!t||(yty&&ytBad);$('#eq').hidden=emb||!t;$('#pw').hidden=!t;
 if(!t){$('#ttl').innerHTML=`Dodaj knjigu sa + · <a href="https://www.youtube.com/results?search_query=${encodeURIComponent('Od pašnjaka do naučenjaka audio knjiga')}" target="_blank" rel="noopener" style="color:var(--gold)">traži Pupina</a>`;return}
 if(emb){$('#efr').src=t.embed;$('#ttl').innerHTML=`${t.name} · <a href="${t.url}" target="_blank" rel="noopener" style="color:var(--gold)">otvori u pregledaču</a>`;return}
 if(rad){const fm=t.fm||['',''];$('#rcard .fm').innerHTML=fm[0]+'<small>'+fm[1]+'</small>';$('#ttl').textContent=t.name+' · '+(t.r==='lofi'&&ytWhy?'YouTube greška '+ytWhy:t.sub);if(play)radio();return}
 if(ytBad){$('#ttl').innerHTML=`YouTube ne dozvoljava ugrađeni plejer (greška ${ytWhy||'?'}) · ${ytLink(t,'otvori na YouTube-u')}`;return}
 $('#ttl').textContent=t.name;
 if(!yt||!yt.loadVideoById)return;
 const pos=grp==='knjige'&&t.y?(LS.get('pos:'+t.y)||0):0;
 if(t.y)yt[play?'loadVideoById':'cueVideoById']({videoId:t.y,startSeconds:pos});
 else yt[play?'loadPlaylist':'cuePlaylist']({listType:'playlist',list:t.pl})}
const go=d=>{const L=list();if(L.length<2)return;idx=(idx+d+L.length)%L.length;LS.set('idx:'+grp,idx);apply(true)};
$('#prev').onclick=()=>go(-1);$('#next').onclick=()=>go(1);
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{grp=b.dataset.g;LS.set('grp',grp);idx=LS.get('idx:'+grp)||0;apply(false)});
$('#pp').onclick=()=>{if(isR()){au.paused?radio():stopAu();return}if(yt&&yt.getPlayerState)yt.getPlayerState()===1?yt.pauseVideo():yt.playVideo()};

/* audio knjige: dodavanje YouTube linka (video ili plejlista) */
function ytParse(u){try{const x=new URL(u.trim()),l=x.searchParams.get('list'),v=x.searchParams.get('v')||(x.hostname==='youtu.be'?x.pathname.slice(1):(x.pathname.match(/\/(?:live|embed|shorts)\/([\w-]{11})/)||[])[1]);if(l&&!/^RD/.test(l))return{pl:l};if(v)return{y:v}}catch{}return null}
$('#addb').onclick=()=>{const u=prompt('Nalepi YouTube link audio knjige ili plejliste:');if(!u)return;const p=ytParse(u);if(!p){alert('Link nije prepoznat');return}
 const n=prompt('Naslov:','')||'Audio knjiga',b=LS.get('books')||[];b.push({...p,name:n,custom:1});LS.set('books',b);idx=BOOKS.length+b.length-1;LS.set('idx:knjige',idx);apply(true)};
$('#delb').onclick=()=>{const t=cur();if(!t||!confirm('Ukloniti ovu knjigu?'))return;LS.set('books',(LS.get('books')||[]).filter(x=>!(x.custom&&x.y===t.y&&x.pl===t.pl)));idx=0;apply(false)};
setInterval(()=>{const t=cur();if(grp==='knjige'&&t&&t.y&&yt&&yt.getPlayerState&&yt.getPlayerState()===1)LS.set('pos:'+t.y,Math.floor(yt.getCurrentTime()))},10000);

/* YouTube plejer */
const PV={controls:0,modestbranding:1,playsinline:1,rel:0,disablekb:1,fs:0,iv_load_policy:3};
if(location.protocol==='https:')PV.origin=location.origin;
if(location.protocol.startsWith('http'))PV.widget_referrer=location.href;
function mkPlayer(hostUrl){
 if(yt&&yt.destroy)try{yt.destroy()}catch{}
 $('#ywrap').innerHTML='<div id="yt"></div>';
 const o={width:'100%',height:'100%',videoId:LOFI[0].y,playerVars:PV,events:{
  onReady(){yt.setVolume(+$('#vol').value);apply(false)},
  onStateChange(e){const t=cur();if(!t||!(t.y||t.pl))return;const c=e.data;
   if(c===1){fails=0;setPlaying(true);try{const d=yt.getVideoData();$('#ttl').textContent=(grp==='knjige'?t.name+' · ':'')+(d.title||t.name)}catch{}}
   else if(c===2)setPlaying(false);else if(c===0&&t.y&&list().length>1)go(1)},
  onError(e){const t=cur();if(!t||!(t.y||t.pl))return;const c=e.data;
   if(c===2||c===100||c===101||c===150){
    if(grp==='knjige')$('#ttl').innerHTML=`Greška ${c}: video ne dozvoljava ugrađivanje · ${ytLink(t,'otvori na YouTube-u')}`;
    else if(list().length>1&&++fails<list().length)go(1);else{ytBad=true;ytWhy=(typeof c==='undefined'?'skripta':c);apply(false)}}
   else if(!nc){nc=true;mkPlayer('https://www.youtube-nocookie.com')}
   else{ytBad=true;ytWhy=(typeof c==='undefined'?'skripta':c);apply(false)}}}};
 if(hostUrl)o.host=hostUrl;
 yt=new YT.Player('yt',o)}
window.onYouTubeIframeAPIReady=()=>mkPlayer();
if(location.protocol==='file:')ytBad=true;
apply(false);
if(!ytBad){const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';sc.onerror=()=>{ytBad=true;ytWhy=(typeof c==='undefined'?'skripta':c);apply(false)};document.head.append(sc)}

/* tastatura i daljinski (TV): razmak/Play-Pause, Next/Prev, 1-2-3 menjaju grupu */
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test((e.target||{}).tagName||''))return;const k=e.key;
 if(k==='MediaPlayPause'||(k===' '&&e.target===document.body)){e.preventDefault();$('#pp').click()}
 else if(k==='MediaTrackNext'||k==='n')$('#next').click();
 else if(k==='MediaTrackPrevious'||k==='p')$('#prev').click();
 else if(k==='1'||k==='2'||k==='3')document.querySelectorAll('#tabs button')[+k-1].click()});

setInterval(applyPhase,5*60e3);setInterval(weather,15*60e3);setInterval(rates,30*60e3);setInterval(news,15*60e3);setInterval(ping,2*60e3);setInterval(sports,10*60e3);setInterval(air,30*60e3);setInterval(cal,60*60e3);setInterval(drawSp,60e3);

wake();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wake();weather();rates();news();ping();sports()}});
if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
addEventListener('click',async()=>{if(document.fullscreenElement||matchMedia('(display-mode: fullscreen)').matches)return;try{await document.documentElement.requestFullscreen({navigationUI:'hide'});await screen.orientation.lock('landscape')}catch{}});
