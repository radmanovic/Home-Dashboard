<style>

.sun{top:-14vh;right:-8vw;width:48vh;height:48vh;border-radius:50%;background:radial-gradient(circle,#ffe9a8 0%,rgba(255,226,140,.55) 40%,rgba(255,226,140,0) 70%);animation:glow 6s ease-in-out infinite}
.cl{left:0;border-radius:50vh;background:#fff;filter:blur(1.2vh);animation:drift linear infinite}
.dr{top:0;width:2px;height:3.4vh;background:linear-gradient(transparent,rgba(70,120,175,.55));animation:fall linear infinite}

@keyframes rise{from{opacity:0;transform:translateY(3vh)}to{opacity:1;transform:none}}

@keyframes kb{to{transform:scale(1.09)}}
@keyframes eq{50%{height:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>

<script>
/* PODEŠAVANJA */

 pol:['https://www.kurir.rs/rss/vesti/politika','https://www.danas.rs/feed/','https://n1info.rs/feed/'],

const $=s=>document.querySelector(s);
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const LOC='sr-Latn-RS';
function tick(){const n=new Date();{const[h,m]=n.toLocaleTimeString(LOC,{hour:'2-digit',minute:'2-digit',hour12:false}).split(':');$('#t').innerHTML=h+'<b class="c">:</b>'+m}$('#d').textContent=n.toLocaleDateString(LOC,{weekday:'long',day:'numeric',month:'long'})}
tick();setInterval(tick,10000);

/* VREME */
function wmo(c,n){if(c===0)return['Vedro',n?'🌙':'☀️'];if(c<=2)return['Pretežno vedro',n?(c===1?'🌙':'🌥️'):'🌤️'];if(c===3)return['Oblačno','☁️'];if(c<=48)return['Magla','🌫️'];if(c<=57)return['Rosulja','🌦️'];if(c<=67)return['Kiša','🌧️'];if(c<=77)return['Sneg','🌨️'];if(c<=82)return['Pljuskovi','🌦️'];if(c<=86)return['Snežni pljuskovi','🌨️'];return['Grmljavina','⛈️']}
let shown=0;

function phase(j){
 try{const hm=t=>{const m=t.slice(11,16).split(':');return +m[0]*60+ +m[1]},n=new Date().toLocaleTimeString('sv-SE',{timeZone:'Europe/Belgrade',hour12:false,hour:'2-digit',minute:'2-digit'}).split(':'),now=+n[0]*60+ +n[1];
  if(!j.daily.sunrise)return now<390||now>1230?'night':'day';
  const sr=hm(j.daily.sunrise[0]),ss=hm(j.daily.sunset[0]);
  if(now<sr-30||now>ss+30)return'night';if(now<sr+60)return'dawn';if(now>ss-60)return'dusk';return'day'}catch{return'day'}}
function fx(code,ph){
 const k=code<=1?'sun':code<=3||(code>=45&&code<=48)?'cloud':(code>=71&&code<=77)||code===85||code===86?'snow':'rain',f=$('#fx'),key=k+ph;
 if(f.dataset.k===key)return;f.dataset.k=key;f.replaceChildren();
 const R=(a,b)=>a+Math.random()*(b-a),add=(c,st)=>{const e=document.createElement('i');e.className=c;Object.assign(e.style,st);f.append(e)};
 if(k==='sun'){if(ph==='night'){for(let n=0;n<32;n++){const z=R(.3,.8)+'vh';add('st',{left:R(0,100)+'%',top:R(0,75)+'%',width:z,height:z,animationDelay:-R(0,5)+'s',animationDuration:R(2,5)+'s'})}}else add(ph==='day'?'sun':'sun low',{})}
 if(k==='cloud')for(let n=0;n<4;n++)add('cl',{top:R(2,60)+'%',width:R(22,38)+'vw',height:R(8,14)+'vh',opacity:R(.4,.75),animationDuration:R(40,70)+'s',animationDelay:-R(0,60)+'s'});
 if(k==='rain')for(let n=0;n<30;n++)add('dr',{left:R(0,100)+'%',animationDuration:R(.7,1.3)+'s',animationDelay:-R(0,1.3)+'s'});
 if(k==='snow')for(let n=0;n<24;n++){const z=R(.8,1.6)+'vh';add('sf',{left:R(0,100)+'%',width:z,height:z,animationDuration:R(5,10)+'s',animationDelay:-R(0,10)+'s'})}
}
let W=null;

const MOONG=(x,y,k)=>`<g transform="translate(${x} ${y}) scale(${k})"><g class="pl"><path d="M8 -26a28 28 0 1 0 22 40 22 22 0 0 1 -22 -40z" transform="translate(-14 -2)" fill="#f6e7a6"/></g><circle class="tw" cx="24" cy="-22" r="2" fill="#fff"/><circle class="tw" cx="34" cy="-8" r="1.5" fill="#fff" style="animation-delay:-1s"/></g>`;
function iconSVG(code,night){
 const B=night?MOONG:SUNG,cl=(t='',c='fl')=>`<g transform="${t}"><g class="${c}">${CLOUD}</g></g>`;
 const drops=[38,50,62].map((x,i)=>`<line class="rd" x1="${x}" y1="80" x2="${x-2}" y2="88" stroke="#5aa0e0" stroke-width="3.5" stroke-linecap="round" style="animation-delay:-${i*.37}s"/>`).join('');
 const flakes=[36,50,64].map((x,i)=>`<circle class="sn" cx="${x}" cy="82" r="2.8" fill="#fff" stroke="#a9c8e8" style="animation-delay:-${i}s"/>`).join('');
 let k='rain',g;
 if(code<=1)return `<svg viewBox="0 0 100 100" class="${night?'moon-glow':''}">${B(50,50,1)}</svg>`;
 if(code===2)g=B(38,36,.75)+cl('translate(6 8)');

setInterval(applyPhase,5*60e3);setInterval(weather,15*60e3);setInterval(rates,30*60e3);setInterval(news,15*60e3);setInterval(ping,2*60e3);
async function wake(){try{await navigator.wakeLock.request('screen')}catch{}}
wake();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wake();weather();rates();news();ping()}});
if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
addEventListener('click',async()=>{if(document.fullscreenElement||matchMedia('(display-mode: fullscreen)').matches)return;try{await document.documentElement.requestFullscreen({navigationUI:'hide'});await screen.orientation.lock('landscape')}catch{}});
